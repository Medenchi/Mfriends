# This server block is safe for a shared malinacode.is-a.dev VPS.
# MFriends owns only /mfriends/, /api/, /ws and /uploads/.
# Keep other project routes in separate location blocks or included nginx snippets.
server {
    listen 80;
    server_name malinacode.is-a.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name malinacode.is-a.dev;

    ssl_certificate /etc/letsencrypt/live/malinacode.is-a.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/malinacode.is-a.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    client_max_body_size 6m;

    index index.html;

    location = /mfriends {
        return 301 /mfriends/;
    }

    location = /mfriends/ {
        alias /opt/mfriends/frontend/index.html;
        add_header Cache-Control "no-cache";
    }

    location /mfriends/ {
        alias /opt/mfriends/frontend/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* ^/mfriends/(.+\.(?:css|js|svg|png|jpg|jpeg|webp|ico))$ {
        alias /opt/mfriends/frontend/$1;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        alias /opt/mfriends/uploads/;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            audio/webm webm;
            audio/mpeg mp3;
        }
        default_type application/octet-stream;
        add_header Cache-Control "private, max-age=3600";
    }
}
