[project]
name = "mfriends"
version = "0.1.0"
description = "MFriends secure friends, teammates and buddy platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosmtplib>=3.0.2",
  "email-validator>=2.1.1",
  "fastapi>=0.111.0",
  "bcrypt>=4.0.1",
  "pydantic-settings>=2.3.4",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["backend*"]
