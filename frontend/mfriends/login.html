<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — MFriends</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="index.html">M<span>Friends</span></a>
        <nav class="nav"><a href="register.html">Регистрация</a></nav>
      </header>
      <main class="auth-layout">
        <form id="login-form" class="form-card">
          <p class="eyebrow">Безопасный вход</p>
          <h1>С возвращением.</h1>
          <label class="field">
            <span>Email</span>
            <input name="email" type="email" autocomplete="email" required>
          </label>
          <label class="field">
            <span>Пароль</span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary" type="submit">Войти</button>
          <a class="secondary" href="register.html">Нужен аккаунт?</a>
        </form>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script>bindAuthForms();</script>
  </body>
</html>
