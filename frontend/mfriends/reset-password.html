<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сброс пароля — MFriends</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar"><a class="brand" href="index.html">M<span>Friends</span></a><nav class="nav"><a href="login.html">Вход</a></nav></header>
      <main class="auth-layout">
        <div class="form-card">
          <p class="eyebrow">Сброс пароля</p>
          <h1>Верни доступ безопасно.</h1>
          <form id="reset-request-form">
            <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
            <button class="secondary" type="submit">Отправить письмо</button>
          </form>
          <form id="reset-confirm-form">
            <label class="field"><span>Токен сброса</span><input name="token" placeholder="заполнится из email-ссылки, если есть"></label>
            <label class="field"><span>Новый пароль</span><input name="password" type="password" minlength="10" required></label>
            <button class="primary" type="submit">Сменить пароль</button>
          </form>
          <p id="reset-status" class="notice"></p>
        </div>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script>bindAuthForms();</script>
  </body>
</html>
