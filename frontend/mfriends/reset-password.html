<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password — MFriends</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <main class="auth-layout">
        <form class="form-card">
          <p class="eyebrow">PASSWORD RESET</p>
          <h1>Choose a new password.</h1>
          <p class="notice">The backend token endpoint is ready to extend with final password write logic.</p>
          <label class="field"><span>New password</span><input type="password" minlength="10"></label>
          <button class="primary" type="button">RESET PASSWORD</button>
        </form>
      </main>
    </div>
  </body>
</html>
