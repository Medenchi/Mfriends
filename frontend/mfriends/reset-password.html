<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password — MFriends</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar"><a class="brand" href="index.html">M<span>Friends</span></a><nav class="nav"><a href="login.html">LOGIN</a></nav></header>
      <main class="auth-layout">
        <div class="form-card">
          <p class="eyebrow">PASSWORD RESET</p>
          <h1>Recover access safely.</h1>
          <form id="reset-request-form">
            <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
            <button class="secondary" type="submit">SEND RESET EMAIL</button>
          </form>
          <form id="reset-confirm-form">
            <label class="field"><span>Reset token</span><input name="token" placeholder="auto-filled from email link if present"></label>
            <label class="field"><span>New password</span><input name="password" type="password" minlength="10" required></label>
            <button class="primary" type="submit">RESET PASSWORD</button>
          </form>
          <p id="reset-status" class="notice"></p>
        </div>
      </main>
    </div>
    <script src="js/api.js"></script>
    <script>bindAuthForms();</script>
  </body>
</html>
